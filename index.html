<!DOCTYPE html>
<html>

<head>
    <title>Add Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            color: #222;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 6px;
        }

        input:focus,
        select:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }


        /* SUBMIT BUTTON */

        #submitBtn {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            background-color: #2563eb;

            color: white;

            cursor: pointer;

            transition: 0.2s;
        }

        #submitBtn:hover {
            background-color: #1d4ed8;
        }


        /* Incomplete form */

        #submitBtn.incomplete {
            background-color: #dc2626;
        }

        #message {
            text-align: center;

            color: #dc2626;

            font-size: 14px;

            margin-top: 10px;

            min-height: 20px;
        }


        @media (max-width: 600px) {

            .container {
                margin: 20px;

                padding: 25px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>Add Student</h1>


    <form id="studentForm">

        <div class="form-group">

            <label>Roll Number</label>

            <input
                type="number"
                id="roll"
                placeholder="Enter roll number"
                required
            >

        </div>


        <div class="form-group">

            <label>Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter student name"
                required
            >

        </div>


        <div class="form-group">

            <label>Marks</label>

            <input
                type="number"
                id="marks"
                placeholder="Enter marks"
                required
            >

        </div>


        <div class="form-group">

            <label>Address</label>

            <input
                type="text"
                id="address"
                placeholder="Enter address"
                required
            >

        </div>


        <div class="form-group">

            <label>Placed</label>

            <select id="placed">

                <option value="">
                    Select placement status
                </option>

                <option value="true">
                    Yes
                </option>

                <option value="false">
                    No
                </option>

            </select>

        </div>


        <button
            type="submit"
            id="submitBtn"
        >
            Submit
        </button>

        <div id="message"></div>

    </form>

</div>


<script>

const form = document.getElementById("studentForm");

const submitBtn = document.getElementById("submitBtn");

const message = document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const roll = document.getElementById("roll").value;

    const name = document.getElementById("name").value.trim();

    const marks = document.getElementById("marks").value;

    const address = document.getElementById("address").value.trim();

    const placed = document.getElementById("placed").value;


    /* Check all fields */

    if (
        roll === "" ||
        name === "" ||
        marks === "" ||
        address === "" ||
        placed === ""
    ) {

        submitBtn.classList.add("incomplete");

        message.innerText = "Please fill all fields";

        return;
    }


    submitBtn.classList.remove("incomplete");

    message.innerText = "";


    const studentData = {

        roll: Number(roll),

        name: name,

        marks: Number(marks),

        address: address,

        placed: placed === "true"

    };


    try {

        const response = await fetch(
            "http://127.0.0.1:8000/add_student",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(studentData)

            }
        );


        if (response.ok) {

            window.location.href = "/static/students.html";

        }

        else {

            message.innerText = "Something went wrong";

        }

    }

    catch (error) {

        message.innerText = "Unable to connect to server";

    }

});

</script>

</body>

</html>
