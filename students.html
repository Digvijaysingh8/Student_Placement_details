<!DOCTYPE html>
<html>

<head>

    <title>Student List</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* MAIN CONTAINER */

        .container {
            width: 100%;
            max-width: 1000px;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }


        /* HEADING */

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 30px;

            color: #222;
        }


        /* TABLE */

        table {
            width: 100%;

            border-collapse: collapse;

            font-size: 16px;
        }


        th {
            background-color: #2563eb;

            color: white;

            padding: 14px;

            text-align: left;
        }


        td {
            padding: 12px;

            border-bottom: 1px solid #ddd;
        }


        tr:hover {
            background-color: #f8fafc;
        }


        /* ACTION BUTTONS */

        .edit-btn,
        .delete-btn {
            border: none;

            padding: 8px 14px;

            border-radius: 5px;

            color: white;

            font-size: 14px;

            cursor: pointer;

            margin-right: 6px;

            transition: 0.2s;
        }


        /* EDIT */

        .edit-btn {
            background-color: #2563eb;
        }

        .edit-btn:hover {
            background-color: #1d4ed8;
        }


        /* DELETE */

        .delete-btn {
            background-color: #dc2626;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }


        /* MOBILE RESPONSIVE */

        @media (max-width: 700px) {

            body {
                align-items: flex-start;
            }

            .container {
                margin: 20px;

                padding: 20px;

                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Student List</h1>

        <table>

            <thead>

                <tr>

                    <th>Roll</th>
                    <th>Name</th>
                    <th>Marks</th>
                    <th>Address</th>
                    <th>Placed</th>
                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="studentTable">

                <!-- Student data will come here -->

            </tbody>

        </table>

    </div>


    <script>

        async function loadStudents() {

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/get_student"
                );

                const students = await response.json();

                const table = document.getElementById(
                    "studentTable"
                );


                table.innerHTML = "";


                for (const roll in students) {

                    const student = students[roll];


                    table.innerHTML += `

                        <tr>

                            <td>${roll}</td>

                            <td>${student.Name}</td>

                            <td>${student.Marks}</td>

                            <td>${student.Address}</td>

                            <td>
                                ${student.Placed ? "Yes" : "No"}
                            </td>

                            <td>

                                <button
                                    class="edit-btn"
                                    onclick="editStudent(${roll})"
                                >
                                    Edit
                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteStudent(${roll})"
                                >
                                    Delete
                                </button>

                            </td>

                        </tr>

                    `;

                }

            }

            catch (error) {

                console.log(error);

            }

        }


        /* EDIT STUDENT */

        function editStudent(roll) {

            window.location.href =
                `edit.html?roll=${roll}`;

        }


        /* DELETE STUDENT */

        async function deleteStudent(roll) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this student?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                const response = await fetch(

                    `http://127.0.0.1:8000/delete_student/${roll}`,

                    {
                        method: "DELETE"
                    }

                );


                if (response.ok) {

                    loadStudents();

                }

                else {

                    alert("Delete failed");

                }

            }

            catch (error) {

                console.log(error);

                alert("Unable to connect to server");

            }

        }


        /* LOAD DATA */

        loadStudents();

    </script>

</body>

</html>
